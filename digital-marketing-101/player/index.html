<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Marketing 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf5ea;--card:#fffdf7;--ink:#26303b;--indigo:#2e3a52;--brass:#b9822e;--teal:#2f6f6a;--ok:#1e7a34;--bad:#b3261e;--line:#e2d7bf}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif}
h1,h2,h3,.disp{font-family:Fraunces,"Iowan Old Style",Georgia,serif}
header{background:var(--indigo);color:#f7efdd;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header .t{font-family:Fraunces,Georgia,serif;font-size:19px}
header .s{font-size:12.5px;opacity:.75}
#progresswrap{background:#1d2739;height:7px}#progress{height:7px;background:var(--brass);width:0%;transition:width .4s}
.wrap{max-width:1060px;margin:0 auto;padding:20px 16px 60px}
.hero{border:2.5px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;overflow:hidden;background:var(--card)}
.hero img{width:100%;display:block}
.hero .cap{padding:18px 24px 22px}
.hero h1{font-size:34px;margin:2px 0 6px;line-height:1.1}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:700}
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px 255px 18px 225px/225px 18px 255px 18px;padding:18px 22px;margin:16px 0}
.card.plain{border-radius:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:16px 0}
.mcard{background:var(--card);border:2px solid var(--ink);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s}
.mcard:hover{transform:translateY(-3px) rotate(-.3deg)}
.mcard img{width:100%;height:150px;object-fit:cover;display:block;border-bottom:2px solid var(--ink)}
.mcard .b{padding:12px 16px 14px}
.mcard h3{margin:2px 0 4px;font-size:19px}
.chip{display:inline-block;border:1.5px solid var(--ink);border-radius:20px;padding:1px 10px;font-size:12px;margin:2px 4px 2px 0;background:#fff}
.chip.done{background:var(--teal);color:#fff;border-color:var(--teal)}
.banner{border:2.5px solid var(--ink);border-radius:18px 225px 18px 255px/255px 18px 225px 18px;overflow:hidden}
.banner img{width:100%;max-height:340px;object-fit:cover;display:block}
.beat p{line-height:1.62;margin:10px 0;font-size:16.5px}
.beat p:first-of-type::first-letter{font-family:Fraunces,Georgia,serif;font-size:2.1em;color:var(--brass);font-weight:700}
.screen{background:var(--indigo);color:#eaf2ff;border-radius:10px;padding:12px 16px;margin:14px 0;font-family:ui-monospace,Menlo,monospace;font-size:14.5px;border:2px solid var(--ink)}
.screen .lab{font-size:11px;letter-spacing:.14em;color:#f2c063;text-transform:uppercase;display:block;margin-bottom:5px;font-family:inherit}
.check{border:2px dashed var(--brass);border-radius:14px;padding:14px 18px;margin:16px 0;background:#fffaf0}
.check .lab{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700}
.opt{display:block;border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;margin:7px 0;cursor:pointer;background:#fff;font-size:15.5px}
.opt:hover{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:#edf7ef;font-weight:600}
.opt.wrong{border-color:var(--bad);background:#fbf0ef}
.why{font-size:14.5px;margin:6px 2px 2px;display:none}
.btn{background:var(--indigo);color:#f7efdd;border:2px solid var(--ink);border-radius:12px 225px 12px 255px/255px 12px 225px 12px;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer;margin:6px 8px 6px 0}
.btn.brass{background:var(--brass)} .btn.teal{background:var(--teal)}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
table{border-collapse:collapse;width:100%}td,th{border:1.5px solid var(--line);padding:8px 10px;text-align:left;font-size:15px;vertical-align:top}
.small{font-size:13.5px;color:#5a5344} li{margin:5px 0;line-height:1.5}
.flag{background:#fbf0ef;border:1.5px solid var(--bad);border-radius:10px;padding:8px 14px;margin:8px 0}
input[type=text]{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;width:260px;background:#fff}
.cert{text-align:center;border:3px double var(--brass);border-radius:10px;padding:10px}
.cert img{width:100%;border-radius:6px}
details.tutor{border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;background:#fff}
details.tutor summary{cursor:pointer;font-weight:600}
details.tutor p{line-height:1.55;margin:8px 0 2px}
@media(max-width:700px){.hero h1{font-size:27px}}
</style></head>

rate digital from traditional marketing", "use the field's basic vocabulary: audience, channel, campaign, content, touchpoint", "describe what digital marketing and e-commerce practitioners actually do"], "lessons": [{"title": "Marketing, Defined", "medium": "illustrated lesson", "runtime_min": 1.3, "script": "PRESENTER: Start with the word itself. Marketing is everything a business does to connect something it offers with the people who might want it — understanding those people, creating something of value for them, telling them about it, and making the exchange easy. Advertising is one small part of marketing, not a synonym for it.\n\nPRESENTER: Digital marketing is marketing carried out through digital channels — the internet and connected devices. A search result, a social post, an email, a video, a product page: when a business uses these to reach and engage people, that is digital marketing.\n\nPRESENTER: See the four jobs inside the definition, because the whole course is built on them. Understand: find out who the people are and what they need — that becomes personas and journeys in Module 2. Create: shape an offer worth wanting. Communicate: choose channels and messages — Module 3. Exchange: make buying easy, then measure what happened — Modules 1 and 4. A business doing only one of the four is not doing marketing; it is doing a fragment of it.\n\n[ON SCREEN: Marketing = connecting an offer with the people who want it. Digital marketing = doing it through digital channels.]", "checks": [0, 1]}, {"title": "Why Digital Changed Marketing", "medium": "illustrated lesson", "runtime_min": 1.2, "script": "PRESENTER: Traditional marketing — print, radio, television, billboards, direct mail — is one-way and estimated. A business bought space, broadcast a message at everyone who passed, and guessed at the results from surveys and sales trends.\n\nPRESENTER: Digital channels changed three properties at once. First, digital marketing is measurable: you can count exactly how many people saw a message, clicked it, and bought. Second, it is targetable: a message can be aimed at people chosen by interests, behaviour, and situation, rather than by which newspaper they happen to read. Third, it is two-way: the audience answers back — comments, reviews, messages, shares — and businesses are expected to respond. Marketing stopped being a broadcast and became a conversation with receipts.\n\n[ON SCREEN: Measurable · Targetable · Two-way — the three properties traditional channels cannot match]\n\nPRESENTER: Those three properties explain everything else in this course. Measurement is why Module 4 exists. Targeting is why audiences and personas, Module 2, matter so much. And the two-way property is why engagement — the audience visibly responding — became a central idea in Module 3.", "checks": [2]}, {"title": "The Basic Vocabulary", "medium": "illustrated lesson", "runtime_min": 1.6, "script": "PRESENTER: Every field has load-bearing words, and digital marketing's appear in every job posting and every later module. Learn these five properly now.\n\nPRESENTER: An audience is the group of people a message is meant for. A channel is the medium used to reach them — email is a channel, search is a channel, each social platform is a channel. Content is the material itself: the post, the video, the article, the product page. A campaign is a coordinated set of activities, usually with one goal and a start and end — several pieces of content, across one or more channels, working together. A touchpoint is any single moment of contact between a person and a brand: seeing an ad is a touchpoint, so is reading a review, opening an email, or walking past the shop.\n\n[ON SCREEN: Audience · Channel · Content · Campaign · Touchpoint]\n\nPRESENTER: One example, using all five. A bakery (the business) wants new parents (the audience) to know about its birthday cakes. It runs a two-week campaign: a short video and two photo posts (the content) on Instagram and in a parents' email newsletter (the channels). Every time a parent sees one, that is a touchpoint. Nothing here is advanced — but every advanced thing in this field is built from these five words.", "checks": [3]}, {"title": "E-Commerce, Defined", "medium": "illustrated lesson", "runtime_min": 1.3, "script": "PRESENTER: Digital marketing's close relative, e-commerce, is narrower: buying and selling itself, done online. A shop's Instagram post is digital marketing. The purchase that happens in its online store is e-commerce. The two work as a pair — marketing brings people to the store; e-commerce is the store.\n\nPRESENTER: An online store can be the brand's own storefront — a website the brand runs — or a stall inside a marketplace, a large platform where many sellers offer goods side by side. Own store: more control, but the brand must attract its own visitors. Marketplace: visitors are already there, and the platform takes fees and sets rules.\n\n[ON SCREEN: E-commerce = the transaction. Digital marketing = everything that brings the buyer to it.]\n\nPRESENTER: Inside either kind of store, a purchase has named parts. The product page presents one item: images, description, price, reviews. The cart is where chosen items collect. Checkout is the sequence where the buyer gives delivery details and pays, and a payment service moves the money securely. Fulfillment is everything after: picking, packing, shipping, delivery — and returns, which are part of e-commerce, not an exception to it.", "checks": [4]}, {"title": "What Digital Marketers Do", "medium": "illustrated lesson", "runtime_min": 1.4, "script": "PRESENTER: Foundations courses always answer the beginner's real question: what do the people in this field actually do all day? The work divides into areas that match this course's map. Content work: planning and making the material. Channel work: running search, social, and email activity. E-commerce work: running the store, its product pages, and its promotions. Analytics work: reading the numbers and reporting what they mean. Coordination work: planning campaigns that combine all of it toward one goal.\n\nPRESENTER: In a large organisation these are separate roles and departments — a search specialist, an email coordinator, an e-commerce associate, an analyst. In a small business, one person wears every hat in the same week. The job titles differ; the concepts underneath are the ones in this course, which is why employers' entry-level postings ask for exactly this vocabulary.\n\n[ON SCREEN: The jobs differ. The foundations underneath them do not.]\n\nPRESENTER: Notice what the day's work is not: it is not 'posting things.' Every area runs on the definitions you are learning — audiences, journeys, channels, metrics — applied repeatedly, measured, and adjusted. That loop, not any single tool, is the profession.", "checks": [5]}], "reading": {"title": "Key Terms — Module 1", "text": "Marketing: the work of connecting an offer with the people who want it — understanding customers, creating value, communicating it, and making exchange easy. Digital marketing: marketing done through digital channels (search, social, email, websites, video, apps). Traditional marketing: pre-digital channels — print, radio, TV, billboards, direct mail. E-commerce: buying and selling goods or services over the internet. Audience: the people a message is intended for. Channel: a medium used to reach an audience. Content: the material published — posts, videos, articles, pages. Campaign: a coordinated set of marketing activities with one goal and a defined period. Touchpoint: any single contact between a person and a brand. Storefront: a brand's own online shop. Marketplace: a platform hosting many sellers. Product page: the page presenting one item for sale. Cart: the holding area for chosen items. Checkout: the steps of providing details and paying. Fulfillment: picking, packing, shipping, delivery, and returns.", "minutes": 0.7}, "quiz": {"pass_fraction": 0.8, "perfect_required": false, "questions": [{"text": "What is digital marketing, precisely?", "options": ["Advertising on the internet", "Marketing carried out through digital channels to reach and engage people", "Owning a website", "Posting on social media every day"], "answer_index": 1, "explanation": "Digital marketing is the whole discipline of marketing done through digital channels — advertising is only one part of it."}, {"text": "A customer buys a jacket from a brand's online store. That purchase itself is:", "options": ["Digital marketing", "A campaign", "E-commerce", "A touchpoint"], "answer_index": 2, "explanation": "E-commerce is the buying and selling. The marketing is what brought the customer to the store."}, {"text": "Which is NOT one of the three properties that distinguish digital marketing?", "options": ["It is measurable", "It is targetable", "It is two-way", "It is always free"], "answer_index": 3, "explanation": "Much digital marketing is paid. Measurable, targetable, and two-way are the distinguishing properties."}, {"text": "A coordinated two-week push with one goal, several posts, and two channels is a:", "options": ["Touchpoint", "Campaign", "Channel", "Piece of content"], "answer_index": 1, "explanation": "A campaign coordinates content across channels toward one goal in a defined period."}, {"text": "What is the main trade-off between a brand's own storefront and a marketplace?", "options": ["Storefronts are free, marketplaces are not", "A storefront gives control but the brand must attract its own visitors; a marketplace supplies traffic but takes fees and sets rules", "Marketplaces do not allow marketing", "There is no difference"], "answer_index": 1, "explanation": "Control and independence versus built-in traffic under someone else's rules and fees."}, {"text": "Picking, packing, shipping, and handling a return are all part of:", "options": ["Checkout", "Fulfillment", "Payment processing", "Retention"], "answer_index": 1, "explanation": "Fulfillment covers everything after payment, returns included."}]}, "practical": {"title": "Vocabulary in the Wild", "task": "You are given five short descriptions of business activities (provided in the exercise sheet). For each one, state: is it marketing, e-commerce, or both? Name the channel, the content, and the audience. Then write each of this module's five core terms (audience, channel, content, campaign, touchpoint) in your own words, without looking at the reading.", "pass_criteria": "all five activities classified correctly with the channel, content, and audience identified for each; the five definitions are in the learner's own words and match the module's meanings (marketing is not defined as 'advertising')", "signoff_role": "reviewer"}, "tutor": [{"a": "No — advertising is one part of marketing: the paid promotion part. Marketing also includes understanding customers, shaping the offer, and making exchange easy. Module 1's definition is the one the capstone grades: marketing connects an offer with the people who want it. (Module 1, Lesson 1.)", "q": "Is marketing just advertising with a fancier name?"}, {"a": "Digital marketing is reaching and engaging people through digital channels. E-commerce is the buying and selling itself, done online. The Instagram post is marketing; the purchase in the online store is e-commerce. (Module 1, Lessons 1 and 4.)", "q": "What is the difference between digital marketing and e-commerce?"}, {"a": "Three properties: it is measurable (results can be counted exactly), targetable (messages aimed at chosen people), and two-way (the audience answers back). Traditional channels like print and TV are one-way and estimated. (Module 1, Lesson 2.)", "q": "What makes digital marketing different from traditional marketing?"}, {"a": "A coordinated set of activities with one goal and a defined period — several pieces of content, across one or more channels, working together. (Module 1, Lesson 3.)", "q": "What is a campaign?"}]}, {"id": "JOUR", "title": "The Customer Journey and the Marketing Funnel", "art": "data:image/webp;base64,UklGRqJzAQBXRUJQVlA4IJZzAQDwaQWdASpMBN0CPpVEnEolo6KiKHVrILASiWVu/EkNHlJ4ZRAzFWuPfR9LpPN80nkvj5/tvWUyiui9Af33/t80PqN8pfpnc5163f7TkM3rfZBN6W/xn5Y+7H5L/D/6//Ffkl6Y/k/1H+f/vv+f/6/+M9zz6i8ufsP9z/7/9r6ofzj8Y/w/8J6T/9j/Sflp6h/n/8v/2v9J7BH5X/Sv9t/h/yM+Mr8H/s/8HwiN8/4P/k/1nsHe3P2v/uf5P0/ftf/X/oPWn7Tf+L/Qf6v5Av6B/dP+z/mvc7/u+Hp+h/6/sCf1D/Mf+7/UfnN9N/+f/9v95/uvVz9c//T/b/AZ/Qf8F/5/817en///8PxG/fL///+r4jP3Y////3OBZLqWPzzr7l6WZdOBm0KO+qS5Hvo/7vupkyUcT/2jvxY/PPZ3L0sXa3AjMRJRaIVLTkLUu5gmcOpw6k89+k9s+ZuZTi4SeCa3bdOV2W1oX356HgaRy1MZ35ixOgvDqVgV4+ycNSyk2byFqXb/dSrat+GWTslddqMea4PS21U4d+XrhM8SCeJdyIGMHe4xMYZ059C1LlIOSK1YFSGz3YtS9rMXKMOH3h9fJ0DGEPnArUswEZqXctPH5NOVR6TTjii3xeN7XYU3H0feQEYygdrKoULUu5ensuXSgZa6Q1kLkDz/d8Ufv3yX/PTbVr2hLGR2WqLpZghXd6IUCfKUMvuXpYsy4vc/0gn1LuXuDNpC3fyIE0pf3cpCAkomIV0CjnUFtj93bpa2nM6gYEreDPBQobt5nDIuUrbVZZ4auRSdgzj2/PPCC/6sYgW6vvxAzaNz1AhMk4sOk57Mka9OlPSnzTi4lmUOEgbmm+TkJduyxKCO4AHWlA0UNsWY4QhbeWkobD4sXgr4MpWuWKYt0+ISFH7dhXIQBsYsL9eT27NttAPYkPHwn+qL/qWVcnJQtS5V2FFhjjHfpRxiP1l6WlHGIJH1Th34sgqq0HSCWtXAV4Bi0F3a0RxUGIkBIPcntLVysDVGDpLVDryu4cyZ3+ZFrtfHCk4DTjVrZQhbuhbyv/cedYq0Marh1Iduw9RtKboU1CtolIBmRh6k4d+lGw5N5F5UODHvjsk/fSFFMnkeWXtYRKwkS1gtUKEPPlvpYMXCFOaaWArot5xwMZ2kz8KtvcdcsLgZ39vjT/+qcO/Fj886xVqXjkbtxG2LH552ID5HDood0rHHOwxqKitcOs/9vz43C7MeiwGoYAvvskUstlGZT3iIcGMMt56dQjUsfz9mniCFm3d8t1KQXPy2Zr1HmEAnc68yaSoB9ereWYv8s1MyYrN039H1T2TdA7K2+VKHmZkGn1ZedFThDYUgFKLttMwDfvHFDrJw8BOj13MaBmxAzYgZbaRnCpONONuFBLDKajpSxKSsHG3K8DaiARLrLSCfbv1u3q804QcHrPuDzArYKi6kDSF6s3vd3QrgOBGyFWCIrOvtGzBHqAtrRv0kdgUFMin50gVaLVQjkvexrglPvSQvTV+cBvwjjcHxwiOuLp//SAuwlGrYTOtf5exe+q0pHZen+LVGW03V9+IGbRxqeiIvDMUvMRtJkIdW/Iy2V4gzew2+cWaJuOEA4dhtB9hBXMe09ZerOS7doCQpMBeYyyaWVtL8lhNQ7dw4vt95SQGod8jotZeTK0kkhr/ZR3rczI0XWFcrGvY8Y9QPPdsw1hfxm+yRkCBB6FV2H5GFtAdhXn9UVRXYT1gLPve3BV8uplJxorruEbW4a33NcoRiKa5wj6DYo+wdAt2FJ//7ed5DOrdZc/HFLFkAupLyj4dyzQZtzUrnpxn3gDoq77J4QCpG46TqerPfQNBcdavkGBRs  none of them — which is why the journey, broken into stages, becomes the field's favourite planning tool in the next lesson.\n\n[ON SCREEN: The customer journey = the whole path, first awareness to long after purchase]", "checks": [0, 1]}, {"title": "The Funnel as a Model", "medium": "illustrated lesson", "runtime_min": 1.2, "script": "PRESENTER: The marketing funnel is a model of the journey — a picture marketers draw to think with. It is wide at the top, because many people become aware of a brand, and narrow at the bottom, because only some of them buy. The funnel is not a machine and not a trick; it is a map.\n\nPRESENTER: A model's value is the questions it makes precise. With the funnel drawn, a team can ask: at which stage are people dropping away? What does a person at this stage need to hear, and which channel reaches them there? Without the model, those questions blur into 'marketing isn't working,' which no one can act on.\n\n[ON SCREEN: The journey is the path. The funnel is the model of the path.]\n\nPRESENTER: Hold the distinction firmly, because the capstone grades it: the journey is something customers actually travel; the funnel is something marketers draw. Confusing a model with a mechanism — treating the funnel as a device that pushes people — is the classic beginner's error this module exists to prevent.", "checks": [2]}, {"title": "The Four Stages", "medium": "illustrated lesson", "runtime_min": 1.4, "script": "PRESENTER: The standard funnel taught in foundations courses has four stages. Awareness: the person learns the brand exists and what it roughly does. The marketing job here is to be seen and understood, by the right people. Consideration: the person is now evaluating — comparing options, reading reviews, checking prices. The job here is to provide the information a decision needs: details, proof, answers. Conversion: the person takes the action the business wants — most often a purchase, but a signup, a booking, or a download are also conversions. Loyalty: after the purchase, the person returns, buys again, and recommends. The job here is service, follow-up, and reasons to come back.\n\n[ON SCREEN: Awareness → Consideration → Conversion → Loyalty]\n\nPRESENTER: Two things beginners routinely get wrong. First, conversion does not only mean a sale — it means the desired action, whatever the campaign defined: for a newsletter campaign, the conversion is the signup. Second, the funnel does not end at the sale. Loyalty is a stage because keeping a customer is part of marketing's job, and loyal customers produce the most valuable touchpoint of all — a recommendation to someone new, which starts that person's journey at awareness.", "checks": [3]}, {"title": "Personas", "medium": "illustrated lesson", "runtime_min": 1.1, "script": "PRESENTER: 'The audience' is an abstraction until someone makes it concrete. A persona is a semi-fictional profile of an ideal customer — a name, a situation, goals, frustrations, habits — built from research and real customer patterns, not invented from thin air.\n\nPRESENTER: Marketers build personas so decisions have a face. 'Would this help?' is unanswerable; 'would this help Thandi, who runs a guesthouse and does her admin at night?' can actually be debated. A persona also feeds the journey map: the diagram of stages and touchpoints for that specific kind of customer, which is how teams spot the moments that matter.\n\n[ON SCREEN: A persona = a researched, semi-fictional customer you can design decisions for]\n\nPRESENTER: One caution that separates foundations from folklore: a persona is a simplification, and honest marketers say so. It organises thinking; it does not replace watching real customers. Treat it as a hypothesis with a face, and it will serve you well.", "checks": [4]}, {"title": "After the Purchase: Loyalty and Lifetime Value", "medium": "illustrated lesson", "runtime_min": 1.2, "script": "PRESENTER: The funnel's last stage has its own vocabulary. A repeat purchase is a customer buying again. Retention is the practice of keeping customers coming back — service, quality, follow-up communication, loyalty programs that reward returning buyers. Its opposite, churn, is customers leaving and not returning.\n\nPRESENTER: The summary number is customer lifetime value: the total revenue a business expects from one customer across the whole relationship. Its teaching example is simple arithmetic: a customer who spends 40 per order, four times a year, for three years, has a lifetime value of 480. Compare that with the cost of winning the customer in the first place, and a business can see why a kept customer is usually worth more than a new one — winning costs advertising; keeping costs care.\n\n[ON SCREEN: Lifetime value = order value × frequency × years]\n\nPRESENTER: Notice the funnel closing into a loop: a loyal customer's recommendation is earned media (Module 3), which starts a new customer's journey at awareness. Foundations are called foundations because the concepts hold each other up exactly like this.", "checks": [5]}], "reading": {"title": "Key Terms — Module 2", "text": "Customer journey: the complete path a person takes with a brand, from first awareness through purchase to loyalty and advocacy. Marketing funnel: a model of the journey in stages, wide at the top (many people aware) and narrow at the bottom (fewer buy). Awareness: the stage where a person first learns a brand exists. Consideration: the stage of evaluating and comparing options before deciding. Conversion: the moment a person completes a desired action — a purchase, signup, booking, or download, as defined by the campaign. Loyalty: the post-purchase stage of returning, repeating, and recommending. Persona: a semi-fictional profile of an ideal customer, built from research. Journey map: a diagram of stages and touchpoints for a persona. Repeat purchase: a subsequent buy by an existing customer. Retention: keeping customers returning. Churn: customers leaving. Customer lifetime value (LTV): total expected revenue from one customer over the relationship.", "minutes": 0.7}, "quiz": {"pass_fraction": 0.8, "perfect_required": false, "questions": [{"text": "What is the marketing funnel?", "options": ["A sales technique for pressuring buyers", "A model of the customer journey in stages, narrowing from awareness to purchase", "A piece of software", "The path money takes through a business"], "answer_index": 1, "explanation": "The funnel is a model — a map for thinking — not a tactic or a tool."}, {"text": "A shopper compares three laptops, reads reviews, and checks prices. Which stage is she in?", "options": ["Awareness", "Consideration", "Conversion", "Loyalty"], "answer_index": 1, "explanation": "Evaluating and comparing options before deciding is the consideration stage."}, {"text": "For an email newsletter campaign, the conversion is:", "options": ["Any sale the business makes that month", "The email being sent", "A person signing up for the newsletter", "The open rate"], "answer_index": 2, "explanation": "A conversion is the desired action as the campaign defines it — here, the signup."}, {"text": "What is a persona?", "options": ["A celebrity endorser", "A semi-fictional profile of an ideal customer built from research", "A fake social media account", "The average of all customers' ages"], "answer_index": 1, "explanation": "A persona makes 'the audience' concrete enough to write and design for."}, {"text": "A customer spends 50 per order, 3 times a year, for 2 years. Their lifetime value is:", "options": ["150", "300", "50", "900"], "answer_index": 1, "explanation": "50 × 3 × 2 = 300 — order value × frequency × years."}, {"text": "Why is loyalty a funnel stage rather than an afterthought?", "options": ["It isn't — the funnel ends at the sale", "Repeat purchases and recommendations are part of marketing's job, and recommendations start new journeys", "Loyal customers pay higher prices", "It makes the funnel symmetrical"], "answer_index": 1, "explanation": "Post-purchase behaviour feeds the top of the funnel for new customers through recommendations."}]}, "practical": {"title": "Label the Journey", "task": "You are given a written scenario (provided in the exercise sheet) following one customer, 'Maya', from seeing a poster to buying a kettle to recommending it to a friend, in eight moments. Label each moment with its funnel stage, list every touchpoint you can find, and note which persona details the scenario gives you.", "pass_criteria": "all eight moments labelled with the correct stage; at least six distinct touchpoints identified (including the recommendation); persona details listed are the ones the scenario actually states, not invented ones", "signoff_role": "reviewer"}, "tutor": [{"a": "The journey is the real path a person travels, from first awareness to long after purchase. The funnel is a model of that path that marketers draw to think with — wide at the top, narrow at the bottom. A model, never a sales technique. (Module 2, Lessons 1–2.)", "q": "What is the difference between the customer journey and the funnel?"}, {"a": "Only if the campaign defined it that way. A conversion is the desired action: a purchase for a sales campaign, a signup for a newsletter campaign, an install for an app campaign. (Module 2, Lesson 3.)", "q": "Is a conversion always a sale?"}, {"a": "A persona is one researched profile of an ideal customer; the journey is the path customers travel. You use the persona to draw the journey map for that kind of customer — one is a character, the other is that character's route. (Module 2, Lesson 4.)", "q": "What is the difference between a persona and the journey?"}, {"a": "50 × 3 orders is 150 per year; × 2 years is 300. Lifetime value is always order value × frequency × years — which is why retention work targets frequency and duration. (Module 2, Lesson 5.)", "q": "How do I compute lifetime value again?"}]}, {"id": "STRAT", "title": "Strategy and 8LRy23qAswVXCIxqrjbS7PYH8xhpVJZsPCEJ34Yo+5gTDLk5yj8d7IyZQBy4FESmesS6XKtU7K9IMJTFy50R9fu2M23bBuv6PbqcR6PG13PntiLNwyuwEXKeiDN0Q47xYxMv/fCE7YhQvSuLLgfr1gp02x8X4ETH5qnD5YoR2yaC4Mn5+uANegEBuVt+5O47QSn9cAF06ekhdAAAAA", "objectives": ["define strategy and a marketing goal, and why both precede activity", "sort any marketing activity into owned, earned, or paid media with the two tests", "name the main channel families and what each is for", "explain how search engines work and distinguish SEO from SEM", "define content, social media, and email marketing and their key terms"], "lessons": [{"title": "What Strategy Is", "medium": "illustrated lesson", "runtime_min": 1.2, "script": "PRESENTER: Before the channels, the plan. A marketing strategy is a deliberate plan: which goal, for which audience, through which channels, with which message. It is what makes a set of separate activities one campaign instead of random effort.\n\nPRESENTER: The plan starts with a goal stated so it can be checked. Marketers often use the SMART pattern: a goal that is Specific, Measurable, Achievable, Relevant, and Time-bound. 'Grow sales' cannot be checked. 'Sell 200 cake boxes through the online store by the end of June' can be — and notice it already implies an audience, a channel, and a deadline.\n\n[ON SCREEN: Strategy = goal + audience + channel + message, decided before activity]\n\nPRESENTER: Only after the goal comes the budget — the money set aside for the activity, which is real for every channel in this module, not only the paid ones: staff time and tools are costs too. Every ranking, report, and decision later in the field is just these four words — goal, audience, channel, message — argued about with evidence.", "checks": [0]}, {"title": "Owned, Earned, and Paid Media", "medium": "illustrated lesson", "runtime_min": 1.4, "script": "PRESENTER: Foundations courses sort marketing into three kinds by two tests: who controls the channel, and whether placement was paid for. Owned media: channels the business controls — its own website and online store, its email list, its own social profiles. Paid media: placement the business buys — ads on search and social platforms, sponsored posts, paid listings. Earned media: coverage the business did not buy and does not control — press mentions, reviews, shares, recommendations, word of mouth.\n\nPRESENTER: Apply the two tests to one item and the sorting gets easy. A brand's own product page: controlled by the brand, placement unpaid — owned. That same brand's ad on a video platform: bought — paid. A customer filming an unboxing and praising it, unprompted: neither controlled nor bought — earned. Earned is the most persuasive and the least controllable; you can only deserve it.\n\n[ON SCREEN: Sort by control and payment: owned · paid · earned]\n\nPRESENTER: Keep the triad in view for the rest of this module: every channel family you are about to meet sits in one of these three kinds, and the strategy lesson that opened the module is really about choosing a mix of them on purpose.", "checks": [1]}, {"title": "The Channel Families", "medium": "illustrated lesson", "runtime_min": 1.2, "script": "PRESENTER: A quick survey of the main digital channel families, each defined by how it reaches people. Search: reaching people through search engines, with unpaid results and paid ads — the next two lessons. Content marketing: publishing useful material — the lesson after search. Social media: the platforms where people gather and interact. Email: messages sent to people who gave an address. Display: banner-style ads shown on websites and apps. Video: material on video platforms, which overlaps social and content.\n\nPRESENTER: Two habits of thought matter more than the list. First, channels differ in intent: a searcher is actively looking, a social scroller is passing time — the same message behaves differently in each. Second, channels are rented or owned to different degrees: a social profile is a tenancy under platform rules; an email list, collected with permission, is an asset the business holds itself. Foundations students who grasp those two differences already think like marketers.\n\n[ON SCREEN: Channels differ by the audience's intent — and by who owns the ground]", "checks": [2]}, {"title": "How Search Engines Work", "medium": "illustrated lesson", "runtime_min": 1.2, "script": "PRESENTER: Search marketing rests on understanding what a search engine is: a system that answers questions by maintaining an enormous index of the web and ranking pages against each query. It works in three steps. Crawling: automated programs follow links and read pages. Indexing: what they read is analysed and stored in the index, like entries in a library catalogue. Ranking: when someone searches, the engine orders the indexed pages it judges most relevant and useful for that query.\n\nPRESENTER: Two words the field uses constantly: a query is what the person types; a keyword is the term a marketer targets — the two overlap but are not the same thing. And two kinds of results appear on the results page: organic results, the unpaid listings the engine ranked, and paid results, ads bought by businesses, clearly labelled as ads. Both are marketing surfaces; they are reached by completely different work, which is the next lesson.\n\n[ON SCREEN: Crawl → Index → Rank. Organic = unpaid and ranked. Paid = bought and labelled.]", "checks": [3]}, {"title": "SEO and SEM", "medium": "illustrated lesson", "runtime_min": 1.3, "script": "PRESENTER: Two terms divide the search world, and confusing them is a classic beginner error the capstone will test. SEO — search engine optimization — is the practice of earning better organic visibility: making pages clearer, more relevant, better organised, so the engine ranks them higher. Nobody can buy an organic position; it is earned, and it is slow — weeks to months.\n\nPRESENTER: The paid side is search advertising, run as PPC — pay-per-click — where businesses bid in an auction for ad positions on chosen keywords and pay when someone clicks. It is fast: a campaign can appear today, and stops the day the budget stops. SEM, search engine marketing, is the umbrella term for the whole search discipline — some use it for the paid side only, so careful writers say which meaning they intend.\n\n[ON SCREEN: SEO = earn organic rank (slow, unpaid). PPC ads = buy clicks (fast, stops with the budget).]\n\nPRESENTER: Why both exist in one strategy: SEO builds durable presence for questions your audience keeps asking; paid search covers new products, seasons, and gaps. Same results page, opposite mechanics — foundations-level clarity about that difference is most of what 'knowing search' means.", "checks": [4]}, {"title": "Content Marketing", "medium": "illustrated lesson", "runtime_min": 1.1, "script": "PRESENTER: Content marketing is the discipline of creating and distributing valuable, relevant material — articles, videos, guides, podcasts, tools — to attract and keep an audience, rather than only advertising at them. Its bet is compounding: a useful guide keeps answering search queries and earning trust for years, while an ad stops the moment payment stops.\n\nPRESENTER: Content is usually mapped to the funnel from Module 2: material that introduces and teaches serves awareness and consideration; comparisons and detailed guides serve the decision; help and community serve loyalty. The plain test of content marketing versus decoration: the material must be useful to the audience on its own terms, whether or not they ever buy.\n\n[ON SCREEN: Content marketing = useful material that earns attention and trust over time]\n\nPRESENTER: And content is owned media in its natural home — published on the brand's own site and channels — which is why the media triad, the funnel, and this lesson are one connected idea, not three.", "checks": [5]}, {"title": "Social Media Marketing", "medium": "illustrated lesson", "runtime_min": 0.9, "script": "PRESENTER: Social media marketing is marketing through social platforms: publishing content, building a presence, and interacting with an audience where it gathers. Its defining property is the two-way property from Module 1 — the audience replies, remixes, and judges in public.\n\nPRESENTER: The working vocabulary: a post is one published item; engagement is the measurable audience response — likes, comments, shares, saves, clicks; a follower is a person subscribed to the account; organic social is unpaid activity, while paid social is advertising bought on the same platforms. A technical fact with strategic weight: an algorithm — the platform's ranking system — decides which posts each user actually sees, so having followers is not the same as reaching them.\n\n[ON SCREEN: Engagement = the audience's visible response. Algorithm = the gatekeeper between posting and being seen.]", "checks": [6]}, {"title": "Email Marketing", "medium": "illustrated lesson", "runtime_min": 1.1, "script": "PRESENTER: Email marketing is sending commercial messages to a list of people who gave their address, usually with permission. Its vocabulary is precise. The list is the collected addresses. A segment is a subset of the list chosen by some characteristic. A campaign is one coordinated send; an automation is a message or sequence triggered by behaviour — a welcome after signup, a reminder after a cart is left.\n\nPRESENTER: Three ideas keep email lawful and effective. Permission: sending to bought or scraped addresses is not a strategy, it is spam — unsolicited bulk mail — and it breaks anti-spam law in most places. Deliverability: whether messages actually reach inboxes instead of spam folders, earned through sender reputation. And ownership: unlike a social following, the list belongs to the business — which is why foundations courses treat email as the anchor owned channel.\n\n[ON SCREEN: List · Segment · Campaign · Automation — and permission underneath all of it]", "checks": [7]}], "reading": {"title": "Key Terms — Module 3", "text": "Strategy: a deliberate plan of goal, audience, channels, and message. SMART goal: Specific, Measurable, Achievable, Relevant, Time-bound. Budget: money (and time) set aside for marketing activity. Owned media: channels the business controls (website, store, email list, own profiles). Paid media: placement bought (search ads, social ads, sponsored content). Earned media: unpaid, uncontrolled coverage (reviews, shares, press, word of mouth). Search engine: a system that crawls, indexes, and ranks web pages against queries. Query: what a person types into a search engine. Keyword: the term a marketer targets. Organic results: unpaid listings ranked by the engine. SEO: search engine optimization — earning organic visibility. PPC: pay-per-click advertising, bought by auction. SEM: search engine marketing, the umbrella term for search. Content marketing: creating useful material to attract and retain an audience. Engagement: measurable audience response (likes, comments, shares, clicks). Algorithm: a platform's system for deciding what each user sees. Email list: addresses collected, usually with permission. Segment: a chosen subset of a list. Automation: messages triggered by behaviour. Spam: unsolicited bulk email. Deliverability: reaching inboxes rather than spam folders.", "minutes": 0.9}, "quiz": {"pass_fraction": 0.8, "perfect_required": false, "questions": [{"text": "A magazine writes about a café because its cakes are famous. The café did not pay or ask. This is:", "options": ["Owned media", "Paid media", "Earned media", "A campaign"], "answer_index": 2, "explanation": "Coverage you neither bought nor control is earned media."}, {"text": "A brand's email list is which kind of media, and why does it matter?", "options": ["Earned — it costs nothing", "Owned — the business controls the channel and holds the asset itself", "Paid — sending email always costs money", "None of these"], "answer_index": 1, "explanation": "Owned channels are under the business's control; the list is an asset, unlike a platform following."}, {"text": "Which is a SMART goal?", "options": ["Grow sales", "Be more visible online", "Sell 200 cake boxes through the online store by the end of June", "Do more marketing"], "answer_index": 2, "explanation": "Specific, measurable, and time-bound — the others cannot be checked."}, {"text": "The correct order of how a search engine works is:", "options": ["Rank → crawl → index", "Crawl → index → rank", "Index → rank → crawl", "Advertise → crawl → rank"], "answer_index": 1, "explanation": "Engines crawl pages, index what they find, then rank the index against each query."}, {"text": "SEO is best described as:", "options": ["Buying the top position on a results page", "Earning better organic visibility by making pages more relevant and better organised", "Paying per click for keyword ads", "A type of social media"], "answer_index": 1, "explanation": "Organic positions are earned, never bought. Buying clicks is PPC."}, {"text": "In PPC search advertising, the business pays:", "options": ["A flat yearly fee", "When its ad is clicked", "Only when a sale happens", "Per page indexed"], "answer_index": 1, "explanation": "Pay-per-click: the auction wins the position; payment happens on the click."}, {"text": "What is engagement?", "options": ["The number of followers an account has", "The measurable audience response — likes, comments, shares, saves, clicks", "A paid partnership", "How long a post took to write"], "answer_index": 1, "explanation": "Engagement measures visible response, which is why it differs from raw audience size."}, {"text": "Why is permission central to email marketing?", "options": ["Emails without it reach more people", "Unsolicited bulk mail is spam — unlawful in most places and destructive to deliverability", "Permission is only a courtesy", "Platforms require it for automations"], "answer_index": 1, "explanation": "Permission is the legal and practical foundation of the channel: lists are built, not bought."}]}, "practical": {"title": "Sort the Media, Read a Results Page", "task": "Two provided exercises. (1) Ten marketing items are listed (provided in the exercise sheet) — the brand's own product page, a search ad, an unprompted customer review video, a newspaper mention, an email newsletter, a sponsored post, and four more. Sort each into owned, earned, or paid, using the two tests. (2) You are shown a labelled screenshot of a search results page. Identify which results are paid and which are organic, and state in one sentence how you can tell.", "pass_criteria": "at least 9 of 10 items sorted correctly with the two tests named; both results types identified with the correct evidence (the ad label / its absence and position)", "signoff_role": "reviewer"}, "tutor": [{"a": "Use the two tests from the lesson. Who controls it? A newspaper controls its own pages, so for the brand the article is not owned. Did the brand pay for the placement? No. Not controlled, not paid — earned. (Module 3, Lesson 2.)", "q": "A newspaper writes about a shop for free. Is that owned, earned, or paid?"}, {"a": "Because the two listings are earned and bought in opposite ways. The one with the 'Ad' label is paid — an advertiser won an auction for that query. The unpaid listings were ranked for relevance; SEO is the work of earning a better place among them. Same page, two different economics. (Module 3, Lessons 4–5.)", "q": "Why do some search results say 'Ad' and others don't?"}, {"a": "No. The organic listing itself is never bought — that is what separates SEO from paid search. Money in SEO goes to the work: content, site improvements, expertise. Anyone promising to sell you the top organic spot itself is describing something search engines do not offer. (Module 3, Lesson 5.)", "q": "Can I just pay Google to rank first organically?"}, {"a": "No — it is sending to a list built with permission. Unsolicited bulk mail is spam: unlawful in most places and destructive to deliverability. The list being owned by the business is exactly why email is the anchor owned channel. (Module 3, Lesson 8.)", "q": "Is email marketing just sending emails to anyone?"}]}, {"id": "MEAS", "title": "Measuring Performance", "art": "data:image/webp;base64,UklGRno9AQBXRUJQVlA4IG49AQBQtASdASpMBN0CPpVGnUqlo6KppjSbWTASiWVu+9Nwj+at2pKlkf4Ey7eOQ/rugP1r7ga//F3k2c/50/tHfA9PX9L3k3nQ81/zYt/e3r/IH/U/+l/Kr3h/Kv4j/af4f8kfUP8p+v/1X+A/y//g/xvui/8fkg66/8/+59Uv5t+N/5f+L/en2r/7f+N8jflx/n/5H/Q/tn8hf5b/U/9j/g/3l/x3yIfkf+v/a/8bxtOB/3v/e/0/sF+5f2D/l/4r/P/td8M323/g/zPrP+9f6z/wf5v8vfsC/YT/neW1+03mBeoft38An9U/zP/o/0f5vfTr/k//j/d/8L1f/WP/1/2P+5+RH+gf4L/xf5b/T+/j////z8P/32///vVmRzntNDhLpuNxuNxuNpXq7R+mhNyMS2V1PnRo/PzCvAXKbJVKZDClJOc92IlMxLZbJSmHV6tVWa+3MjCMQQZEGBPg9X1aFrh788ZTKZTUPhQ0rBWHjDunUl4cIQEISC2aNY1j5eKb3WfDhlLMeKSTDg/q2dDf1KcCE1/d3wAtdY+B43IZUBRAUfRDudObjR+/0+4JuAVBxrvGlb546G5MzWynuHcsApUpj9+QsyfHrsRNknFz455qQCc8AQlSevsb/CY8pw5GpJb61BTKPZrkqvRJzccRSNFLyGuv1Mv+U9n22U3eilkyPEQ03c9Km6ip7NghRze5uIEcXpV7zLEEtx+weqR1c9C351E69rn0b7wL4lVuiqVr3YeDMceMYKnMoWuAEBvZS03M0hiWvOUfEgJX42Kr8+6jyfC2nUnGWMgzCCF3fQo8hHo2HqZL/2QwE4L9u4XCtEWXd/oB6cxnZQ+PpWWdv55/fBEpmuCfNwzNObrazFks4Tm98JWiKW2HsZ8+KfzLgk/n/HotiU96Nq2PL8mWI606H8lIkUL1uNZIRUvCEID3NGSmu0eUKF8ze7gYJ8i2d0zuVkMDi8CQCQw55McnOe7EGQivObBYHAknOnZMUEqo76BdsYbiHbZY1iDZebTTOxH8hcM2B5psB8HYA/zVi2IL8UoWx+boSHOadE+5xl0C6L65as36luDKA/cf7n35sEUzmJQdXBX9qVtuHMFXEp+kJ98m9VcLKtgQIO+imIyxPaRtDx8BzELTAxq61O1Br3/0EhLO9lSMIlCFVjpaABQXSuzW+d0/ZEQMYORnak0QWkT9bJ/T/6IWrRUQe95/9XB8SG3Tpgub765mVxBuvib62XHJvtWzIREDvT2Lm0T+hNbHS4BwKK+bceqr4+Bfe9b+tExCnDDZbmT+A3qa+bQe/ZRpB0ndBvDiquBv+yFIvI2LBlnBkxNasRxYR1/5Pe0lMoMoIlRt5jugCc6+pjQcn0e8Npmly8ylcTDZd+pGx5Gz8t76Qagm3p+7vkmoMm8L+EWArLburA7obZWl1pehTwwKu27XZj/sy6ipFeNIzi+uMTyJx3G35F6VEoNMBfSkwDxjv5l9s3T2UIphUMyFF1Kod8s9bW2bQbwxPWucVdath2QdVMTPzVk9FuFFe+mS+mhKni42WjgbnR8b2citd3IM8yo5QGWhElvwxHvHpOddKKXdyQk6zmZOtNut27Q4DvZVLmR0AlekF6uuLbrP33cH5ELa9WV9tvW5yZwlq7n+/DrmIWM3v94EFy95yKu }, {"title": "Impressions, Reach, and Click-Through Rate", "medium": "illustrated lesson", "runtime_min": 1.0, "script": "PRESENTER: The counting words, in order. An impression is one display of an ad or piece of content to one screen — the same person seeing it three times is three impressions. Reach is the number of distinct people who saw it at least once — usually the smaller number, and the one that answers 'how many people did we get in front of?' A click is one tap or press on the item.\n\nPRESENTER: The first ratio: click-through rate, CTR — clicks divided by impressions, shown as a percentage. If an ad was shown 4,000 times and clicked 100 times, its CTR is 100 over 4,000: 2.5 percent. Read honestly, CTR says how compelling the item was to the people shown it — high CTR with low sales means the promise and the page disagree; that gap is a diagnosis, not a mystery.\n\n[ON SCREEN: CTR = clicks ÷ impressions. Impressions count displays; reach counts people.]", "checks": [2]}, {"title": "Conversion Rate and Return on Investment", "medium": "illustrated lesson", "runtime_min": 1.2, "script": "PRESENTER: Conversion rate is conversions divided by the base the campaign defines — usually visitors or clicks. If 500 people visited a product page and 25 bought, the conversion rate is 5 percent. The base must always be stated: '5 percent conversion' without 'of page visitors' is an incomplete claim, and foundations-trained readers ask for the base automatically.\n\nPRESENTER: Finally, the money question. Return on investment, ROI, compares what marketing gained with what it cost: ROI equals gain minus cost, divided by cost. A campaign that cost 200 and produced 700 in attributed revenue has an ROI of 250 percent — every unit of currency returned itself plus two and a half more. Zero percent is break-even; below that, the campaign cost more than it returned.\n\n[ON SCREEN: Conversion rate = conversions ÷ visitors (state the base). ROI = (gain − cost) ÷ cost.]\n\nPRESENTER: ROI is where Module 3's budget word returns: none of these numbers exist until someone decided what to spend, on which audience, through which channel — the strategy. Measurement is the strategy's report card.", "checks": [3]}, {"title": "A/B Testing and Reading Results", "medium": "illustrated lesson", "runtime_min": 1.1, "script": "PRESENTER: The foundations method for improving any of these numbers is the A/B test: show two versions of one thing — two headlines, two images, two subject lines — to comparable audiences at the same time, and compare the metric. The discipline is one variable: if the headline and the image both changed, a difference in results cannot be attributed, and the test taught nothing.\n\nPRESENTER: Reading results, then, is a small set of moves: name the metric and its formula, state the base, compare against the goal or the previous period, and ask what the number cannot tell you. Metrics describe behaviour; they do not explain motives — that is what the journey and persona work in Module 2 is for. A marketer who can compute and a marketer who can interpret are the same person on a good day; this course has trained you to be both.\n\n[ON SCREEN: A/B test = two versions, one variable, same time, compare the metric]", "checks": [4]}], "reading": {"title": "Key Terms — Module 4", "text": "Analytics: collecting and interpreting data about marketing activity. Metric: any single measured number. KPI (key performance indicator): a metric chosen as decisive for a specific goal. Impression: one display of content or an ad to one screen. Reach: the number of distinct people who saw something at least once. Click: one tap or press on an item. Click-through rate (CTR): clicks ÷ impressions, as a percentage. Conversion rate: conversions ÷ a stated base (visitors, clicks), as a percentage. Return on investment (ROI): (gain − cost) ÷ cost, as a percentage; 0% is break-even. A/B test: comparing two versions of one item with one variable changed, shown to comparable audiences at the same time. Attribution: deciding which marketing activity gets credit for a result.", "minutes": 0.6}, "quiz": {"pass_fraction": 0.8, "perfect_required": false, "questions": [{"text": "An ad was shown 10,000 times and clicked 250 times. Its CTR is:", "options": ["25%", "2.5%", "0.25%", "40%"], "answer_index": 1, "explanation": "250 ÷ 10,000 = 0.025 = 2.5%."}, {"text": "What is the difference between impressions and reach?", "options": ["There is none", "Impressions count displays (repeats included); reach counts distinct people", "Reach is always the larger number", "Impressions apply only to email"], "answer_index": 1, "explanation": "One person seeing an ad three times = 3 impressions, reach of 1."}, {"text": "800 people visited a page and 40 bought. The conversion rate (base: visitors) is:", "options": ["0.5%", "20%", "5%", "40%"], "answer_index": 2, "explanation": "40 ÷ 800 = 0.05 = 5% of visitors."}, {"text": "A campaign cost 200 and produced 200 in revenue. Its ROI is:", "options": ["100%", "0% — break-even", "200%", "Cannot be computed"], "answer_index": 1, "explanation": "(200 − 200) ÷ 200 = 0%. Nothing gained, nothing lost."}, {"text": "In a valid A/B test of an email subject line, the two versions must:", "options": ["Go to different-sized lists a week apart", "Differ only in the subject line and run to comparable audiences at the same time", "Both be sent by different brands", "Contain different offers as well"], "answer_index": 1, "explanation": "One variable, comparable conditions — otherwise the difference cannot be attributed."}]}, "practical": {"title": "Read a Campaign Report", "task": "You are given a one-page campaign report (provided in the exercise sheet) with impressions, clicks, visitors, orders, spend, and revenue filled in. Compute the CTR, the conversion rate (state your base), and the ROI, showing each formula. Then write three sentences: what the report says went well, what went badly, and one thing the numbers cannot tell you.", "pass_criteria": "all three computations correct with formulas shown and the conversion base stated; the interpretation sentences cite the report's actual figures, and the 'cannot tell' sentence names a genuine limit of the data (a motive, a cause, an audience detail)", "signoff_role": "reviewer"}, "tutor": [{"a": "Impressions count displays — you seeing a post three times is three impressions. Reach counts distinct people — you are a reach of one. Reports give both because they answer different questions: how much was shown, versus how many people it reached. (Module 4, Lesson 2.)", "q": "Why do reports show both impressions and reach?"}, {"a": "State the base — that is the lesson's whole point. Conversion rate is conversions divided by a base (usually page visitors or clicks), and '5% conversion' with no base named is an incomplete statement. (Module 4, Lesson 3.)", "q": "Which base do I use for a conversion rate — visitors or clicks?"}, {"a": "(Gain − cost) ÷ cost, as a percentage. Gain is what the campaign brought in, cost is what it consumed. Cost 200, gain 700: (700 − 200) ÷ 200 = 250%. At 0% the campaign exactly paid for itself. (Module 4, Lesson 3.)", "q": "Walk me through ROI once more."}]}], "final": {"title": "Foundations Capstone", "description": "Open-book assessment over the provided case pack 'Thandi's Plants', an online plant shop, containing: a page of described marketing activities, a short customer story, a labelled search-results description, and a small results table (impressions, clicks, visitors, orders, spend, revenue). The learner classifies, traces, judges, computes, and defines — the whole course in one case.", "rubric": [["Classification", "Activities sorted into owned / earned / paid and marked marketing, e-commerce, or both, with the two sorting tests named"], ["Journey reading", "The customer story traced through all four funnel stages with its touchpoints identified"], ["Search judgement", "SEO and paid-search activities correctly separated, with the difference explained in one paragraph"], ["Computation", "CTR, conversion rate (base stated), and ROI computed from the table with formulas shown"], ["Definitions", "Any five course terms defined in the learner's own words, matching the course's meanings"]], "critical_fails": ["Classifying a paid search listing as SEO", "Defining conversion as only a purchase", "Describing the funnel as a sales technique rather than a model", "Presenting a metric without its formula, or with the wrong base, as correct"]}, "completion_standard": "Every module check passed at its stated mark AND all four module practicals signed off AND the final capstone passed with no critical fails. The completion record lists per-module check scores, the four signed practicals, and the capstone verdict — a foundations certificate a learner can be proud of and a later course can build on.", "trainer_note": "This course teaches definitions and concepts only. It assumes no business, product, or budget, and no exercise requires one: every practical runs on material the course provides. The three classic confusions to watch for: marketing used as a synonym for advertising (Module 1), conversion used to mean only a sale (Module 2), and paid placement described as SEO (Module 3). Later Tessera courses (201 level) apply these foundations to real decisions; nothing in this course skips ahead to them."};</script>
<script>
const C = COURSE_DATA;
const KEY = 'tessera-course-v2-' + C.title;
let S = JSON.parse(localStorage.getItem(KEY) || '{"answers":{},"practical":{},"final":false,"name":"","review":{}}');
S.review = S.review || {};
let view = {kind:'home'};
function save(){localStorage.setItem(KEY, JSON.stringify(S));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function correctCount(m){const a=S.answers[m.id]||{}; return m.quiz.questions.reduce((n,q,qi)=>n+(a[qi]===q.answer_index?1:0),0);}
function quizPassed(m){const need=m.quiz.perfect_required?m.quiz.questions.length:Math.ceil(m.quiz.pass_fraction*m.quiz.questions.length); return correctCount(m)>=need;}
function modDone(m){return quizPassed(m)&&S.practical[m.id];}
function doneCount(){return C.modules.filter(modDone).length + (S.final?1:0);}
function complete(){return C.modules.every(modDone)&&S.final;}
function render(){
  const pct=Math.round(100*doneCount()/(C.modules.length+1));
  document.getElementById('progress').style.width=pct+'%';
  document.getElementById('pct').textContent=pct+'% complete';
  const M=document.getElementById('main');
  if(view.kind=='home')M.innerHTML=home();
  else if(view.kind=='mod')M.innerHTML=moduleView(C.modules[view.i],view.i);
  else if(view.kind=='review')M.innerHTML=reviewView();
  else if(view.kind=='final')M.innerHTML=finalView();
  else M.innerHTML=recordView();
  wire(); window.scrollTo(0,0);
}
function home(){const t=C.totals;const hrs=Math.floor(t.total/60),mn=Math.round(t.total%60);
  let h='<div class="hero"><img src="'+C.hero+'" alt="Course illustration"><div class="cap"><div class="kicker">'+esc(C.client)+' \u00B7 '+esc(C.kind)+'</div><h1>'+esc(C.title)+'</h1><p style="font-size:17px;line-height:1.55">'+esc(C.front_door.audience)+'</p><p><span class="chip">\u2248 '+hrs+' h '+mn+' min total</span><span class="chip">'+Math.round(t.video_measured)+' min of lessons, measured</span><span class="chip">'+C.modules.length+' modules</span><span class="chip">Illustrated lessons \u00B7 checks as you go</span></p></div></div>';
  h+='<div class="card"><h2 style="margin-top:0">What you will be able to do when you finish</h2><ol>'+C.front_door.outcomes.map(o=>'<li>'+esc(o)+'</li>').join('')+'</ol><p><b>Before you start.</b> '+esc(C.front_door.prerequisites)+'</p><p class="small">'+esc(C.front_door.how_it_works)+' Your progress saves in this browser as you go.</p></div>';
  h+='<h2 class="disp" style="margin:22px 0 4px">The modules</h2><div class="grid">';
  C.modules.forEach((m,i)=>{const d=modDone(m);h+='<div class="mcard" data-go="'+i+'"><img src="'+m.art+'" alt=""><div class="b"><div class="kicker">Module '+(i+1)+'</div><h3>'+esc(m.title)+'</h3><span class="chip'+(d?' done':'')+'">'+(d?'\u2713 complete':correctCount(m)+'/'+m.quiz.questions.length+' checks')+'</span><span class="chip">'+m.lessons.length+' lessons</span><span class="chip">1 practical</span></div></div>';});
  h+='</div><p><button class="btn" data-v="review">Review all checks</button><button class="btn" data-v="final">The Final Assessed Game</button><button class="btn brass" data-v="record">My Training Record</button></p>';
  return h;}
function beats(script){return script.split(/\n\n+/).map(b=>{const ls=b.split('\n').map(x=>x.trim()).filter(Boolean);return ls.map(l=>{if(l.startsWith('[ON SCREEN'))return '<div class="screen"><span class="lab">On the room screen</span>'+esc(l.replace(/^\[ON SCREEN[^\]]*\]\s*/,''))+'</div>'; if(l.startsWith('['))return '<div class="screen"><span class="lab">Cue</span>'+esc(l)+'</div>'; return '<p>'+esc(l.replace(/^PRESENTER:\s*/,''))+'</p>';}).join('');}).join('');}
function checkHTML(m,qi){const q=m.quiz.questions[qi];const a=(S.answers[m.id]||{})[qi];let h='<div class="check"><span class="lab">Quick check</span><p style="margin:6px 0"><b>'+esc(q.text)+'</b></p>';
  q.options.forEach((o,oi)=>{let cls='opt'; if(a!==undefined){if(oi===q.answer_index)cls+=' right'; else if(oi===a)cls+=' wrong';} h+='<span class="opt '+cls+'" data-m="'+m.id+'" data-q="'+qi+'" data-o="'+oi+'">'+String.fromCharCode(65+oi)+') '+esc(o)+'</span>';});
  if(a!==undefined)h+='<div class="why" style="display:block">'+(a===q.answer_index?'<span class="pass">\u2713 Right.</span> ':'<span class="fail">Not quite \u2014 the answer is '+String.fromCharCode(65+q.answer_index)+'.</span> ')+esc(q.explanation)+'</div>';
  return h+'</div>';}
function moduleView(m,i){let h='<p><button class="btn" data-v="home">\u2190 All modules</button></p><div class="banner"><img src="'+m.art+'" alt=""></div>';
  h+='<div class="card"><div class="kicker">Module '+(i+1)+' of '+C.modules.length+'</div><h2 style="margin:4px 0">'+esc(m.title)+'</h2><p><b>By the end of this module you can:</b></p><ul>'+m.objectives.map(o=>'<li>'+esc(o)+'</li>').join('')+'</ul><p>'+m.lessons.map(l=>'<span class="chip">'+esc(l.title)+' \u00B7 \u2248'+l.runtime_min+' min</span>').join('')+'<span class="chip">Reading \u00B7 \u2248'+m.reading.minutes+' min</span><span class="chip">'+m.quiz.questions.length+' quick checks</span></p></div>';
  m.lessons.forEach((l,j)=>{h+='<div class="card"><div class="kicker">Lesson '+(i+1)+'.'+(j+1)+' \u00B7 '+esc(l.medium)+'</div><h3 style="margin:4px 0 8px;font-size:22px">'+esc(l.title)+'</h3><div class="beat">'+beats(l.script)+'</div>';
    l.checks.forEach(qi=>{h+=checkHTML(m,qi);});
    h+='</div>';});
  h+='<div class="card plain"><div class="kicker">Reading \u00B7 \u2248'+m.reading.minutes+' min</div><h3 style="margin:4px 0">'+esc(m.reading.title)+'</h3><p style="line-height:1.6">'+esc(m.reading.text)+'</p></div>';
  const need=m.quiz.perfect_required?'all '+m.quiz.questions.length+' checks':Math.ceil(m.quiz.pass_fraction*m.quiz.questions.length)+' of '+m.quiz.questions.length+' checks';
  h+='<div class="card"><div class="kicker">Practical \u00B7 on the floor</div><h3 style="margin:4px 0">'+esc(m.practical.title)+'</h3><p>'+esc(m.practical.task)+'</p><p><b>Pass:</b> '+esc(m.practical.pass_criteria)+'</p><p>Module checks: <b>'+correctCount(m)+' / '+m.quiz.questions.length+'</b> correct (needs '+need+') \u2014 '+(quizPassed(m)?'<span class="pass">PASSED</span>':'<span class="fail">keep going</span>')+'</p>'+(S.practical[m.id]?'<p class="pass">\u2713 Practical signed off \u2014 recorded.</p>':'<button class="btn teal" id="signoff">Mark practical signed off by '+esc(m.practical.signoff_role)+'</button>')+'</div>';
  if(m.tutor && m.tutor.length){h+='<div class="card"><div class="kicker">Ask Tess \u00B7 the built-in tutor</div><h3 style="margin:4px 0 6px">Questions learners ask about this module</h3>'+m.tutor.map(t=>'<details class="tutor"><summary>'+esc(t.q)+'</summary><p>'+esc(t.a)+'</p></details>').join('')+'</div>';}
  const nx=C.modules[i+1];
  h+='<p>'+(nx?'<button class="btn" data-go="'+(i+1)+'">Next module: '+esc(nx.title)+' \u2192</button>':'<button class="btn" data-v="final">To the Final Assessed Game \u2192</button>')+'</p>';
  return h;}
function reviewView(){let total=0,correct=0;let h='<p><button class="btn" data-v="home">\u2190 All modules</button></p><div class="card"><div class="kicker">Spaced review</div><h2 style="margin:4px 0">Every check in the course, resurfaced</h2><p>Retrieval practice is how this sticks: answer from memory, get the why immediately. Review answers never change your module scores \u2014 this deck is purely for keeping the standard fresh.</p></div>';
  C.modules.forEach((m,mi)=>{h+='<div class="card"><div class="kicker">Module '+(mi+1)+' \u00B7 '+esc(m.title)+'</div>';
    m.quiz.questions.forEach((q,qi)=>{const key=mi+':'+qi;const a=S.review[key];total++; if(a===q.answer_index)correct++;
      h+='<p style="margin:10px 0 4px"><b>'+esc(q.text)+'</b></p>';
      q.options.forEach((o,oi)=>{let cls='opt'; if(a!==undefined){if(oi===q.answer_index)cls+=' right'; else if(oi===a)cls+=' wrong';} h+='<span class="opt '+cls+'" data-r="'+key+'" data-o="'+oi+'">'+String.fromCharCode(65+oi)+') '+esc(o)+'</span>';});
      if(a!==undefined)h+='<div class="why" style="display:block">'+(a===q.answer_index?'<span class="pass">\u2713 Right.</span> ':'<span class="fail">Not quite \u2014 the answer is '+String.fromCharCode(65+q.answer_index)+'.</span> ')+esc(q.explanation)+'</div>';});
    h+='</div>';});
  h+='<div class="card"><p style="font-size:17px">Review score so far: <b>'+correct+' / '+total+'</b> answered correctly.</p></div>';
  return h;}
function finalView(){let h='<p><button class="btn" data-v="home">\u2190 All modules</button></p><div class="card"><div class="kicker">The finish line</div><h2 style="margin:4px 0">'+esc(C.final.title)+'</h2>'+C.final.description.split(/\n\n+/).map(p=>'<p style="line-height:1.6">'+esc(p)+'</p>').join('')+'<h3>The rubric</h3><table>'+C.final.rubric.map(r=>'<tr><td style="width:30%"><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td></tr>').join('')+'</table><h3>Critical fails \u2014 any one ends the assessment</h3>'+C.final.critical_fails.map(f=>'<div class="flag">'+esc(f)+'</div>').join('')+(S.final?'<p class="pass">\u2713 Final assessed game passed \u2014 recorded.</p>':'<button class="btn brass" id="finalbtn">Record final assessed game as PASSED (trainer observed)</button>')+'</div>';return h;}
function recordView(){let rows=C.modules.map((m,i)=>'<tr><td>Module '+(i+1)+' \u2014 '+esc(m.title)+'</td><td>'+correctCount(m)+'/'+m.quiz.questions.length+(quizPassed(m)?' \u2014 passed':'')+'</td><td>'+(S.practical[m.id]?'signed off':'pending')+'</td></tr>').join('');
  let h='<p><button class="btn" data-v="home">\u2190 All modules</button></p><div class="cert"><img src="'+C.hero+'" alt=""><div style="padding:14px 20px"><div class="kicker">Training Record \u00B7 '+esc(C.client)+'</div><h2 style="margin:6px 0">'+esc(C.title)+'</h2><p>Trainee: <input type="text" id="tname" value="'+esc(S.name||'')+'" placeholder="full name"> <button class="btn" id="savename">Save name</button></p><table><tr><th>Module</th><th>Checks</th><th>Practical</th></tr>'+rows+'<tr><td>'+esc(C.final.title)+'</td><td colspan="2">'+(S.final?'passed':'pending')+'</td></tr></table><h3 style="text-align:left">The completion standard</h3><ul style="text-align:left">'+C.completion_standard.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>'+(complete()?'<p class="pass" style="font-size:19px">COURSE COMPLETE \u2014 this record is the certificate.</p><button class="btn brass" onclick="window.print()">Print this record</button>':'<p class="fail">Not yet complete \u2014 the pending items are listed above.</p>')+(C.trainer_note?'<p class="small" style="text-align:left"><b>Trainer\u2019s note.</b> '+esc(C.trainer_note)+'</p>':'')+'</div></div>';return h;}
function wire(){
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{view={kind:'mod',i:+el.dataset.go};render();});
  document.querySelectorAll('[data-v]').forEach(el=>el.onclick=()=>{view={kind:el.dataset.v};render();});
  document.querySelectorAll('.opt[data-q]').forEach(el=>el.onclick=()=>{const mid=el.dataset.m;(S.answers[mid]=S.answers[mid]||{})[+el.dataset.q]=+el.dataset.o;save();const keep=view;view=keep;const y=window.scrollY;render();window.scrollTo(0,y);});
  document.querySelectorAll('.opt[data-r]').forEach(el=>el.onclick=()=>{S.review[el.dataset.r]=+el.dataset.o;save();const y=window.scrollY;render();window.scrollTo(0,y);});
  const so=document.getElementById('signoff'); if(so)so.onclick=()=>{S.practical[C.modules[view.i].id]=true;save();const y=window.scrollY;render();window.scrollTo(0,y);};
  const fb=document.getElementById('finalbtn'); if(fb)fb.onclick=()=>{S.final=true;save();render();};
  const sn=document.getElementById('savename'); if(sn)sn.onclick=()=>{S.name=document.getElementById('tname').value;save();render();};
}
render();
</script>
</body></html>
